[project]
name = "memory-mcp-challenge"
version = "0.1.0"
description = "Hackathon INTELO2026 — Serveur MCP mémoire avec benchmark tokens/qualité"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "tiktoken>=0.7.0",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
demo = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "reportlab>=4.0.0",
]

[project.scripts]
memory-mcp = "memory_mcp.server:main"
membridge-demo = "demo.agent:main"
membridge-web = "demo.web_server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
